<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>jupiter-mail · video card</title>
  <style>
    :root {
      --paper: #f1e8d3;
      --ink: #33291d;
      --faded: #8a7a5f;
      --oxide: #b0472a;
      --olive: #5f6f4e;
      --water: #a9bfae;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      overflow: hidden; color: var(--ink);
      background: radial-gradient(circle at 30% 20%, #f6efdd 0%, #f1e8d3 55%, #e2d4b4 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans GB", "STHeiti", sans-serif;
    }
    .card {
      position: relative; width: 100%; height: 100%;
      display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 64px;
      padding: 60px 80px;
    }
    .scene { position: relative; width: 430px; height: 430px; flex: none; }
    .scene svg { width: 100%; height: 100%; filter: drop-shadow(0 14px 40px rgba(60,45,20,.25)); }
    .copy { max-width: 640px; }
    .eyebrow {
      color: var(--olive); font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: 2px; font-size: 15px; text-transform: uppercase; margin-bottom: 18px;
    }
    h1 { margin: 0; font-size: 86px; line-height: .96; letter-spacing: -3px; font-weight: 800; }
    h1 .ox { color: var(--oxide); }
    h2 {
      margin: 20px 0 0; font-size: 29px; line-height: 1.3; font-weight: 500;
      color: #5c4f3b; max-width: 580px;
    }
    .meta { display: flex; align-items: center; gap: 12px; margin-top: 34px; color: var(--faded); font-size: 16px; }
    .dot { width: 11px; height: 11px; border-radius: 50%; background: var(--oxide); box-shadow: 0 0 18px rgba(176,71,42,.45); }
    .formula {
      margin-top: 28px; color: var(--oxide); font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 25px; letter-spacing: 1px;
    }
    .formula .num { color: var(--olive); }
    .formula small { color: var(--faded); font-size: 15px; display: block; margin-top: 6px; letter-spacing: .5px;
      font-family: -apple-system, sans-serif; }
    .stamp {
      position: absolute; right: 78px; bottom: 66px;
      color: var(--oxide); border: 3px double var(--oxide); border-radius: 6px;
      font: 700 15px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 3px;
      padding: 9px 16px; transform: rotate(-7deg); opacity: .85;
    }
    .scene.end { display: none; }
    body[data-scene="end"] .scene.intro { display: none; }
    body[data-scene="end"] .scene.end { display: block; }
  </style>
</head>
<body data-scene="intro">
<script>
  const scene = new URLSearchParams(location.search).get('scene') || 'intro';
  document.body.dataset.scene = scene;
</script>
<div class="card">
  <div class="scene intro">
    <svg viewBox="0 0 430 430" aria-hidden="true">
      <!-- wind ladder -->
      <g stroke="#5f6f4e" stroke-width="3" fill="#5f6f4e">
        <line x1="70" y1="330" x2="70" y2="72"/>
        <g>
          <line x1="56" y1="316" x2="84" y2="304"/><path d="M84 304 l-9 1 6 6 z"/>
          <line x1="56" y1="268" x2="86" y2="252"/><path d="M86 252 l-9 2 7 5 z"/>
          <line x1="56" y1="220" x2="90" y2="200"/><path d="M90 200 l-9 2 7 6 z"/>
          <line x1="56" y1="172" x2="94" y2="150"/><path d="M94 150 l-9 2 7 6 z"/>
          <line x1="56" y1="124" x2="96" y2="100"/><path d="M96 100 l-9 2 7 6 z"/>
        </g>
        <text x="18" y="340" font-size="13" fill="#8a7a5f" stroke="none" font-family="Menlo, monospace">0 m</text>
        <text x="14" y="134" font-size="13" fill="#8a7a5f" stroke="none" font-family="Menlo, monospace">2.5k</text>
      </g>
      <!-- dashed course to the town -->
      <path d="M212 158 L356 330" stroke="#b0472a" stroke-width="2.5" stroke-dasharray="5 8" fill="none" opacity=".65"/>
      <!-- ground -->
      <path d="M150 348 q30 -6 60 0 t60 0 t60 0 t60 0" stroke="#8a7a5f" stroke-width="2" fill="none"/>
      <!-- town -->
      <g>
        <circle cx="356" cy="330" r="6" fill="#33291d"/>
        <circle cx="356" cy="330" r="14" fill="none" stroke="#b0472a" stroke-width="2.5"/>
        <text x="330" y="366" font-size="15" fill="#33291d" font-family="Georgia, serif" font-style="italic">Crawfordsville</text>
      </g>
      <!-- balloon -->
      <g>
        <line x1="212" y1="150" x2="212" y2="196" stroke="#8a7a5f" stroke-width="1.5"/>
        <path d="M212 196 l-16 12 h32 z" fill="#7a6444"/>
        <ellipse cx="212" cy="112" rx="48" ry="52" fill="#f6efdd" stroke="#33291d" stroke-width="3"/>
        <ellipse cx="212" cy="112" rx="48" ry="18" fill="none" stroke="#33291d" stroke-width="1" opacity=".35"/>
        <ellipse cx="212" cy="112" rx="18" ry="52" fill="none" stroke="#33291d" stroke-width="1" opacity=".35"/>
        <path d="M186 60 q26 -26 52 0" fill="#b0472a" opacity=".85"/>
      </g>
      <!-- mail bag on the ground -->
      <g transform="translate(238,332)">
        <rect x="0" y="0" width="26" height="18" rx="4" fill="#e2d4b4" stroke="#33291d" stroke-width="2"/>
        <text x="13" y="13" font-size="10" text-anchor="middle" fill="#33291d" font-family="Menlo, monospace">MAIL</text>
      </g>
    </svg>
  </div>
  <div class="scene end">
    <svg viewBox="0 0 430 430" aria-hidden="true">
      <g>
        <line x1="215" y1="352" x2="215" y2="238" stroke="#8a7a5f" stroke-width="2"/>
        <path d="M215 238 l-20 14 h40 z" fill="#7a6444"/>
        <ellipse cx="215" cy="150" rx="62" ry="68" fill="#f6efdd" stroke="#33291d" stroke-width="3.5"/>
        <ellipse cx="215" cy="150" rx="62" ry="23" fill="none" stroke="#33291d" stroke-width="1" opacity=".35"/>
        <ellipse cx="215" cy="150" rx="23" ry="68" fill="none" stroke="#33291d" stroke-width="1" opacity=".35"/>
        <path d="M181 82 q34 -34 68 0" fill="#5f6f4e" opacity=".8"/>
        <!-- settled: rope coiled beside -->
        <path d="M282 340 q14 8 0 14 q-14 6 0 12" stroke="#7a6444" stroke-width="3" fill="none"/>
      </g>
      <text x="215" y="404" text-anchor="middle" font-size="16" fill="#8a7a5f" font-family="Georgia, serif" font-style="italic">the bag makes the evening train</text>
    </svg>
  </div>
  <div class="copy">
    <div class="eyebrow">dailyslop · 2026-08-17 · Balloon Airmail Day</div>
    <h1>jupiter-<span class="ox">mail</span></h1>
    <h2 id="sub">1859 年的今天，美国第一批航空邮件升空。气球没有舵——高度，就是你的方向盘。</h2>
    <div class="meta"><span class="dot"></span><span>John Wise · balloon “Jupiter” · Lafayette, Indiana</span></div>
    <div class="formula">
      1 kg H₂ <span class="num">⇒ 13.4 kg</span> 升力——任何高度都成立
      <small>风随高度右转、变快（埃克曼螺线）——想换航向，就换高度</small>
    </div>
  </div>
</div>
<div class="stamp">BALLOON POST · AUG 17</div>
<script>
  if (document.body.dataset.scene === 'end') {
    document.getElementById('sub').textContent = '飞你自己的那一趟——高度就是方向。dailyslop.pages.dev';
  }
</script>
</body>
</html>
