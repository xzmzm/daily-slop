<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>cattery · video card</title>
  <style>
    :root {
      --ink: #f3eadb;
      --muted: #b8aa95;
      --orange: #e8853a;
      --gold: #c9a14a;
      --bg: #17130f;
      --panel: #242018;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      overflow: hidden;
      color: var(--ink);
      background:
        radial-gradient(circle at 78% 22%, rgba(232,133,58,.18), transparent 28%),
        radial-gradient(circle at 18% 85%, rgba(201,161,74,.10), transparent 30%),
        var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans GB", "STHeiti", sans-serif;
    }
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: .14;
      background-image: linear-gradient(rgba(255,255,255,.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.08) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(135deg, black, transparent 72%);
    }
    .card {
      position: relative;
      width: 100%;
      height: 100%;
      padding: 78px 90px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .eyebrow {
      color: var(--orange);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: 2px;
      font-size: 17px;
      text-transform: uppercase;
      margin-bottom: 22px;
    }
    h1 {
      margin: 0;
      font-size: 86px;
      line-height: .98;
      letter-spacing: -3px;
      max-width: 800px;
    }
    h2 {
      margin: 22px 0 0;
      font-size: 32px;
      line-height: 1.25;
      font-weight: 500;
      color: var(--muted);
      max-width: 790px;
    }
    .meta {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 42px;
      color: var(--muted);
      font-size: 18px;
    }
    .dot { width: 11px; height: 11px; border-radius: 50%; background: var(--orange); box-shadow: 0 0 20px rgba(232,133,58,.8); }
    .stamp {
      position: absolute;
      right: 88px;
      bottom: 76px;
      padding: 12px 16px;
      border: 1px solid rgba(232,133,58,.45);
      color: var(--orange);
      border-radius: 999px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 14px;
      letter-spacing: 1px;
    }
    .cat {
      position: absolute;
      right: 128px;
      top: 118px;
      width: 282px;
      height: 360px;
      opacity: .88;
      filter: drop-shadow(0 18px 28px rgba(0,0,0,.35));
    }
    .cat::before {
      content: "🐈";
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 210px;
      filter: grayscale(.4) saturate(1.35);
      transform: rotate(-4deg);
    }
    .cat::after {
      content: "";
      position: absolute;
      width: 210px;
      height: 210px;
      right: 12px;
      top: 63px;
      border-radius: 50%;
      border: 1px solid rgba(232,133,58,.42);
      box-shadow: 0 0 0 18px rgba(232,133,58,.06), 0 0 0 42px rgba(232,133,58,.035);
    }
    .formula {
      position: absolute;
      right: 112px;
      bottom: 145px;
      color: rgba(243,234,219,.64);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 21px;
      letter-spacing: 1px;
    }
    [data-scene="end"] h1 { font-size: 68px; max-width: 870px; }
    [data-scene="end"] h2 { color: var(--ink); }
    [data-scene="end"] .cat { opacity: .62; transform: scale(.86); transform-origin: top right; }
    [data-scene="end"] .formula { color: var(--orange); }
  </style>
</head>
<body data-scene="intro">
  <main class="card">
    <div class="eyebrow" id="eyebrow">DAILY SLOP · 2026.08.08</div>
    <h1 id="headline">cattery</h1>
    <h2 id="subhead">一窝小猫，七个位点。<br>为什么玳瑁猫几乎都是母猫？</h2>
    <div class="meta"><span class="dot"></span><span id="meta">Built by GLM-5.2 · browser genetics sandbox</span></div>
    <div class="cat" aria-hidden="true"></div>
    <div class="formula" id="formula">X<sup>O</sup> + X<sup>o</sup> → tortie ♀</div>
    <div class="stamp" id="stamp">OPEN THE LAB</div>
  </main>
  <script>
    const scene = new URLSearchParams(location.search).get('scene') || 'intro';
    document.body.dataset.scene = scene;
    const copy = {
      intro: {
        eyebrow: 'DAILY SLOP · 2026.08.08',
        headline: 'cattery',
        subhead: '一窝小猫，七个位点。<br>为什么玳瑁猫几乎都是母猫？',
        meta: 'Built by GLM-5.2 · browser genetics sandbox',
        formula: 'X<sup>O</sup> + X<sup>o</sup> → tortie ♀',
        stamp: 'OPEN THE LAB'
      },
      end: {
        eyebrow: 'FROM GENES TO COATS',
        headline: '规则不变，<br>每一窝都不一样。',
        subhead: '把遗传学做成一个可以点击、可以验证、可以玩的网页。',
        meta: 'HTML · CSS · JavaScript · one focused build a day',
        formula: 'Mendel → canvas → kitten',
        stamp: 'TRY IT YOURSELF'
      }
    }[scene] || {};
    for (const [id, value] of Object.entries(copy)) {
      const node = document.getElementById(id);
      if (node) node.innerHTML = value;
    }
  </script>
</body>
</html>
