<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shade Seeker — find the cool spot</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <h1>⛱️ Shade Seeker</h1>
    <p class="tag">Heat-wave survival toy: real solar geometry casts the shadows. Drag the picnicker to shade.</p>
  </header>

  <div class="stage">
    <canvas id="city" width="960" height="600"></canvas>
    <div id="status" class="status">—</div>
  </div>

  <div class="controls">
    <div class="row">
      <label>time <span id="timeVal" class="val">12:00</span></label>
      <input type="range" id="time" min="0" max="24" step="0.05" value="14">
      <button id="play" title="animate the day">▶ play day</button>
    </div>
    <div class="row">
      <label>date <span id="dateVal" class="val">Jul 26</span></label>
      <input type="range" id="doy" min="1" max="365" step="1" value="207">
    </div>
    <div class="row">
      <label>latitude <span id="latVal" class="val">40°N</span></label>
      <input type="range" id="lat" min="-60" max="60" step="1" value="40">
      <button id="reshuffle" title="new random city block">⌂ new block</button>
    </div>
    <div class="row readout">
      <span id="sunInfo">sun —</span>
      <span id="shadePct">shade —</span>
    </div>
  </div>

  <footer>
    <p>Shadows come from the actual sun-position formulas (declination + hour angle → altitude/azimuth).
    Part of <a href="../README.md">daily-slop</a>.</p>
  </footer>
</main>
<script src="app.js"></script>
</body>
</html>
