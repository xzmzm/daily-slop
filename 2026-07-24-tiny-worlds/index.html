<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tiny Worlds 🌍</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="wrap">
      <header class="head">
        <h1>Tiny Worlds <span class="dim">🌍</span></h1>
        <p class="tag">A seeded procedural landscape. Every world is a seed. Share the URL, share the world.</p>
      </header>

      <figure class="stage">
        <canvas id="world" width="960" height="540" aria-label="A procedurally generated tiny world"></canvas>
        <figcaption class="seedline">
          <span class="seed-label">seed</span>
          <code id="seedDisplay" title="current world seed">—</code>
          <span class="mood" id="moodDisplay"></span>
        </figcaption>
      </figure>

      <div class="controls">
        <button id="reshuffle" class="btn primary" type="button">🔀 Reshuffle</button>
        <button id="copy" class="btn" type="button">📋 Copy seed</button>
        <button id="share" class="btn" type="button">🔗 Copy share URL</button>
        <input
          id="seedInput"
          class="seed-input"
          type="text"
          placeholder="paste a seed…"
          aria-label="Enter a seed to load"
        />
        <button id="loadSeed" class="btn" type="button">↪ Load</button>
      </div>

      <p class="hint" id="hint" aria-live="polite"></p>
    </main>

    <script src="app.js"></script>
  </body>
</html>
