<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>burroughs-adder · video card</title>
  <style>
    :root {
      --ink: #f8fafc;
      --dim: #94a3b8;
      --gold: #d4af37;
      --amber: #fbbf24;
      --brass: #e5c07b;
      --iron: #1e293b;
      --crimson: #ef4444;
      --cyan: #38bdf8;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      overflow: hidden; color: var(--ink);
      background: radial-gradient(circle at 70% 30%, #1e1b12 0%, #12100a 55%, #080704 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans GB", "STHeiti", "Outfit", "Georgia", sans-serif;
    }
    .card {
      position: relative; width: 100%; height: 100%;
      display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 64px;
      padding: 60px 80px;
    }
    .scene { position: relative; width: 460px; height: 440px; flex: none; }
    .scene svg { width: 100%; height: 100%; filter: drop-shadow(0 14px 44px rgba(212,175,55,.25)); }
    .copy { max-width: 640px; }
    .eyebrow {
      color: var(--gold); font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: 2.5px; font-size: 14px; text-transform: uppercase; margin-bottom: 18px;
    }
    h1 { margin: 0; font-size: 72px; line-height: .98; letter-spacing: -1px; font-weight: 800; font-family: "Georgia", serif; }
    h1 .ox { color: var(--amber); }
    h2 {
      margin: 20px 0 0; font-size: 24px; line-height: 1.38; font-weight: 500;
      color: #cbd5e1; max-width: 600px;
    }
    .meta { display: flex; align-items: center; gap: 12px; margin-top: 30px; color: var(--dim); font-size: 15px; }
    .dot { width: 11px; height: 11px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 18px rgba(212,175,55,.8); }
    .formula {
      margin-top: 26px; color: var(--gold); font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 20px; letter-spacing: 0.5px;
    }
    .formula .num { color: var(--amber); }
    .formula small { color: var(--dim); font-size: 14px; display: block; margin-top: 6px; letter-spacing: .5px;
      font-family: -apple-system, sans-serif; }
    .stamp {
      position: absolute; right: 78px; bottom: 60px;
      color: var(--gold); border: 2px dashed var(--gold); border-radius: 6px;
      font: 700 14px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 3px;
      padding: 8px 16px; transform: rotate(-4deg); opacity: .9;
      box-shadow: 0 0 15px rgba(212,175,55,0.25);
    }
    .scene.end { display: none; }
    body[data-scene="end"] .scene.intro { display: none; }
    body[data-scene="end"] .scene.end { display: block; }
  </style>
</head>
<body data-scene="intro">
<script>
  const scene = new URLSearchParams(location.search).get('scene') || 'intro';
  document.body.dataset.scene = scene;
</script>
<div class="card">
  <!-- Intro Scene Art: 1888 Burroughs Mechanical Gears & Dashpot -->
  <div class="scene intro">
    <svg viewBox="0 0 460 440" aria-hidden="true">
      <defs>
        <linearGradient id="brassGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#ffd700"/>
          <stop offset="50%" stop-color="#b8860b"/>
          <stop offset="100%" stop-color="#7c5e10"/>
        </linearGradient>
        <radialGradient id="dashpotOil" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#f59e0b"/>
          <stop offset="70%" stop-color="#b45309"/>
          <stop offset="100%" stop-color="#451a03"/>
        </radialGradient>
      </defs>

      <!-- Chassis Border -->
      <rect x="30" y="40" width="400" height="360" rx="16" fill="#151921" stroke="url(#brassGrad)" stroke-width="3"/>

      <!-- Sector Rack Quadrant -->
      <path d="M 120 280 L 160 120 A 160 160 0 0 1 300 240 Z" fill="#2d3748" stroke="#d4af37" stroke-width="3"/>
      <!-- Gear Teeth along Arc -->
      <path d="M 160 120 A 160 160 0 0 1 300 240" fill="none" stroke="#ffe89c" stroke-width="8" stroke-dasharray="8 8"/>

      <!-- 10-Tooth Pinion Wheel -->
      <circle cx="280" cy="160" r="38" fill="url(#brassGrad)" stroke="#ffe89c" stroke-width="2"/>
      <circle cx="280" cy="160" r="14" fill="#0f172a" stroke="#d4af37" stroke-width="2"/>
      <!-- Number on Dial -->
      <text x="280" y="166" font-family="monospace" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">7</text>

      <!-- Oil Dashpot Cylinder -->
      <rect x="70" y="240" width="50" height="120" rx="4" fill="url(#dashpotOil)" stroke="#d4af37" stroke-width="2"/>
      <rect x="76" y="280" width="38" height="12" fill="#cbd5e1"/>
      <line x1="95" y1="280" x2="95" y2="190" stroke="#cbd5e1" stroke-width="4"/>

      <!-- Paper Audit Tape Ribbon -->
      <path d="M 330 80 Q 360 40 400 60 L 400 180 Q 360 160 330 200 Z" fill="#fefce8" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="365" y="100" font-family="monospace" font-size="9" font-weight="bold" fill="#111" text-anchor="middle">125.50</text>
      <text x="365" y="118" font-family="monospace" font-size="9" font-weight="bold" fill="#111" text-anchor="middle">340.00</text>
      <text x="365" y="136" font-family="monospace" font-size="9" font-weight="bold" fill="#dc2626" text-anchor="middle">465.50 *</text>
    </svg>
  </div>

  <!-- End Scene Art -->
  <div class="scene end">
    <svg viewBox="0 0 460 440" aria-hidden="true">
      <circle cx="230" cy="220" r="170" fill="#151921" stroke="#d4af37" stroke-width="4" stroke-dasharray="10 6"/>
      <circle cx="230" cy="220" r="120" fill="url(#brassGrad)" opacity="0.9"/>
      <text x="230" y="210" font-family="Georgia" font-size="28" font-weight="bold" fill="#0f172a" text-anchor="middle">BURROUGHS</text>
      <text x="230" y="245" font-family="monospace" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">1888 · PATENTED</text>
      <circle cx="230" cy="220" r="135" fill="none" stroke="#fff" stroke-width="2"/>
    </svg>
  </div>

  <div class="copy">
    <div class="eyebrow">DAILY SLOP · 2026-08-21 · U.S. PATENT 388,116</div>
    <h1>Burroughs <span class="ox">1888</span></h1>
    <h2>全键盘机械加法器 · 差动齿条与液压阻尼模拟器</h2>
    <div class="meta">
      <span class="dot"></span>
      <span>1888年8月21日 威廉·伯罗斯计算器专利 · 机械计算时代的开端</span>
    </div>
    <div class="formula">
      F_d = (A² μ / a) · v &nbsp;|&nbsp; Tens-Carry Ripple
      <small>四相机械循环 · 差动限位齿条 · 油压防过冲阻尼 · 逆向啮合清零</small>
    </div>
  </div>

  <div class="stamp">AUG 21, 1888</div>
</div>
</body>
</html>
