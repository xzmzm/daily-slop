<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>backrooms — level 0</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage">
    <canvas id="view" width="320" height="180"></canvas>
    <canvas id="grain" width="160" height="90"></canvas>

    <div id="hud">
      <span id="level-label">LEVEL 0</span>
    </div>
    <div id="meters">0 m</div>
    <div id="hint">WASD move &nbsp;·&nbsp; &larr;&rarr; / drag turn &nbsp;·&nbsp; find the dark doorway</div>

    <div id="splash"><h1 id="splash-title"></h1><p id="splash-sub"></p></div>
    <div id="fade"></div>

    <div id="start">
      <div class="start-inner">
        <h1>THE BACKROOMS</h1>
        <p class="sub">an endless stroll through Level 0 (and below)</p>
        <p class="warn">headphones recommended &mdash; the lights hum</p>
        <p class="go">click or press any key to noclip in</p>
      </div>
    </div>
  </div>
  <script src="main.js"></script>
</body>
</html>
